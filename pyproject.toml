[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "az-job-radar"
version = "0.1.0"
description = "Async scraper and data pipeline for Azerbaijani job vacancies, with a FastAPI REST API."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Said Muradkhan" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[project.scripts]
az-job-radar = "az_job_radar.cli:main"

[tool.vercel]
entrypoint = "index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["az_job_radar"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
