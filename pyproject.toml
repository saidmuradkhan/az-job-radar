[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "az-job-radar"
version = "0.1.0"
description = "Async scraper and data pipeline for Azerbaijani job vacancies, with a FastAPI REST API."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Said Muradkhan" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
