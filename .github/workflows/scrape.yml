name: Scrape

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip until the database secret is set
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret is not set yet, nothing to do."
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-python@v5
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
      - if: env.DATABASE_URL != ''
        run: pip install -e .
      - if: env.DATABASE_URL != ''
        run: az-job-radar scrape
