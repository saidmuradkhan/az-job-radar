ожаловать в команду!\\n\\nС уважением, {{companyName}}\",\"template_rejected\":\"Здравствуйте!\\n\\nБлагодарим вас за интерес к вакансии «{{positionName}}» в компании {{companyName}} и время, уделённое процессу отбора.\\n\\nК сожалению, мы вынуждены сообщить, что на данном этапе не готовы продолжить рассмотрение вашей кандидатуры.\\n\\nМы сохраним ваше резюме и свяжемся с вами, если появятся подходящие вакансии.\\n\\nЖелаем вам успехов в профессиональном развитии!\\n\\nС уважением, {{companyName}}\",\"template_archived\":\"\",\"company_event_title_new\":\"Новый отклик\",\"company_event_title_read\":\"Резюме просмотрено\",\"company_event_title_selected\":\"Кандидат отобран\",\"company_event_title_interview\":\"Собеседование назначено\",\"company_event_title_offer\":\"Предложение отправлено\",\"company_event_title_work\":\"Кандидат принят на работу\",\"company_event_title_rejected\":\"Отказ отправлен\",\"company_event_title_archived\":\"Отклик скрыт\",\"company_event_description_new\":\"Получен новый отклик. Резюме кандидата ещё не рассмотрено.\",\"company_event_description_read\":\"Вы ознакомились с резюме. Решение по кандидату пока не принято.\",\"company_event_description_selected\":\"Кандидат успешно прошёл первичный отбор. Свяжитесь с ним, чтобы обсудить детали или назначить собеседование.\",\"company_event_description_interview\":\"Кандидат приглашён на собеседование. Подготовьтесь к проведению встречи.\",\"company_event_description_offer\":\"Вы направили кандидату предложение о работе. Ожидайте решения по вакансии.\",\"company_event_description_work\":\"Кандидат принял предложение. Все условия и дата выхода подтверждены, этап подбора успешно завершён.\",\"company_event_description_rejected\":\"Кандидат не прошёл отбор. Ему было направлено официальное уведомление об отказе.\",\"company_event_description_archived\":\"Отклик перемещен в архив, кандидат не получал уведомление об изменении статуса.\",\"review_results_title\":\"Результат рассмотрения кандидатуры\",\"
